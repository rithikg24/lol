<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Requests</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>
<header>
    <h1>Service Requests</h1>
    <nav>
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/service-requests/new}">New Service Request</a>
    </nav>
</header>
<main>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
        <tr>
            <th>ID</th>
            <th>Customer ID</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.customer != null ? r.customer.id : ''}"></td>
            <td th:text="${r.subject}"></td>
            <td th:text="${r.status}"></td>
            <td>
                <a th:href="@{'/service-requests/' + ${r.id} + '/edit'}">Edit</a>
                <form th:action="@{'/service-requests/' + ${r.id} + '/delete'}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
