<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Request</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>
<header>
    <h1 th:text="${request.id} != null ? 'Edit Service Request' : 'New Service Request'"></h1>
    <nav>
        <a th:href="@{/service-requests}">Back to list</a>
    </nav>
</header>
<main>
    <form th:action="${request.id} != null ? @{'/service-requests/' + ${request.id}} : @{/service-requests}" method="post" th:object="${request}">
        <input type="hidden" th:if="${request.id} != null" th:field="*{id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div>
            <label>Customer ID</label>
            <input type="number" th:field="*{customer.id}">
        </div>
        <div>
            <label>Subject</label>
            <input type="text" th:field="*{subject}">
        </div>
        <div>
            <label>Description</label>
            <input type="text" th:field="*{description}">
        </div>
        <div>
            <label>Status</label>
            <select th:field="*{status}">
                <option th:each="s : ${T(com.xyzbank.crm.domain.enums.ServiceStatus).values()}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
        <div>
            <button type="submit">Save</button>
        </div>
    </form>
</main>
</body>
</html>
