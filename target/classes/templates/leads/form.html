<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lead</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>
<header>
    <h1 th:text="${lead.id} != null ? 'Edit Lead' : 'New Lead'"></h1>
    <nav>
        <a th:href="@{/leads}">Back to list</a>
    </nav>
</header>
<main>
    <form th:action="${lead.id} != null ? @{'/leads/' + ${lead.id}} : @{/leads}" method="post" th:object="${lead}">
        <input type="hidden" th:if="${lead.id} != null" th:field="*{id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div>
            <label>Customer ID</label>
            <input type="number" th:field="*{customer.id}">
        </div>
        <div>
            <label>Product</label>
            <input type="text" th:field="*{product}">
        </div>
        <div>
            <label>Status</label>
            <select th:field="*{status}">
                <option th:each="s : ${T(com.xyzbank.crm.domain.enums.LeadStatus).values()}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
        <div>
            <label>Notes</label>
            <input type="text" th:field="*{notes}">
        </div>
        <div>
            <button type="submit">Save</button>
        </div>
    </form>
</main>
</body>
</html>
