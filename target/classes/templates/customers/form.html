<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>
<header>
    <h1 th:text="${customer.id} != null ? 'Edit Customer' : 'New Customer'"></h1>
    <nav>
        <a th:href="@{/customers}">Back to list</a>
    </nav>
</header>
<main>
    <form th:action="${customer.id} != null ? @{'/customers/' + ${customer.id}} : @{/customers}" method="post" th:object="${customer}">
        <input type="hidden" th:if="${customer.id} != null" th:field="*{id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div>
            <label>First Name</label>
            <input type="text" th:field="*{firstName}">
        </div>
        <div>
            <label>Last Name</label>
            <input type="text" th:field="*{lastName}">
        </div>
        <div>
            <label>Email</label>
            <input type="email" th:field="*{email}">
        </div>
        <div>
            <label>Phone</label>
            <input type="text" th:field="*{phone}">
        </div>
        <div>
            <label>Address</label>
            <input type="text" th:field="*{address}">
        </div>
        <div>
            <button type="submit">Save</button>
        </div>
    </form>
</main>
</body>
</html>
